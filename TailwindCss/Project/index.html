<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Css</title>
</head>
<body>
   <div class="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-lg ring-1 ring-gray-100 transition duration-300 hover:-translate-y-1 hover:shadow-2xl">

    <!-- Product Image -->
    <div class="aspect-square w-full overflow-hidden bg-gray-100">
        <img
            src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
            alt="Product"
            class="h-full w-full object-cover transition duration-500 hover:scale-105"
        >
    </div>

    <!-- Content -->
    <div class="p-5 sm:p-6">

        <!-- Product Title -->
        <h2 class="text-xl font-bold text-gray-900 sm:text-2xl">
            Premium Smart Watch
        </h2>

        <!-- Description -->
        <p class="mt-2 text-sm leading-6 text-gray-500 sm:text-base">
            A stylish and powerful smartwatch designed for your everyday
            lifestyle. Track your health, stay connected, and look great.
        </p>

        <!-- Bottom Section -->
        <div class="mt-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

            <!-- Price -->
            <div>
                <span class="text-2xl font-bold text-gray-900">
                    $129
                </span>
                <span class="ml-1 text-sm text-gray-400 line-through">
                    $159
                </span>
            </div>
            <!-- Blue Button -->
            <button
                class="w-full rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-md shadow-blue-500/20 transition duration-300 hover:bg-blue-700 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-200 sm:w-auto"
            >
                Buy Now
            </button>

        </div>
    </div>
</div>
    
</body>
</html>
